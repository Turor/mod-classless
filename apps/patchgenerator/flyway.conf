# Flyway config for classless DBC SQLite patches.
# jdbc url is supplied by apply_patches.sh / apply_patches.ps1.

flyway.locations=filesystem:dmls/migrations
flyway.table=flyway_schema_history
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.validateOnMigrate=true
flyway.outOfOrder=false
# Patch files contain multiple statements (and some SELECTs used as notes).
flyway.mixed=true
flyway.connectRetries=0
# SQLite's only schema is main.
flyway.defaultSchema=main
# Converter sqlite already has DBC tables; do not require an empty schema.
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=dbc_converter_sqlite
